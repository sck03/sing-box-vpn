name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: '验证通过后发布 GitHub Release（默认只验证）'
        type: boolean
        default: false
      version:
        description: '自定义版本，如 v1.2.3；留空自动递增'
        type: string
        required: false
      bump:
        description: '自动递增位置：patch 补丁 / minor 次版本 / major 主版本'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      draft:
        description: '发布时先保存为草稿'
        type: boolean
        default: false
      notes:
        description: '自定义发布说明；留空由 GitHub 自动生成'
        type: string
        required: false
concurrency:
  group: ci-${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 'release' || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Resolve and synchronize release version
        id: version
        env:
          RELEASE_PUBLISH: ${{ inputs.publish || false }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          go run ./cmd/ci-release
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openvpn iproute2 iptables shellcheck
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Panel DOM regression
        run: npm ci && npm test
      - name: Download verified sing-box 1.14.4
        run: |
          mkdir -p .build/core
          curl -fLsS --retry 2 https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz -o .build/core/core.tar.gz
          echo '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968  .build/core/core.tar.gz' | sha256sum -c -
          tar -xzf .build/core/core.tar.gz -C .build/core
          echo "SING_BOX_BINARY=$PWD/.build/core/sing-box-1.14.4-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Download verified Mihomo 1.19.33 for subscription acceptance
        run: |
          curl -fLsS --retry 2 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz -o .build/core/mihomo.gz
          echo '132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  .build/core/mihomo.gz' | sha256sum -c -
          gzip -dc .build/core/mihomo.gz > .build/core/mihomo
          chmod +x .build/core/mihomo
          echo "MIHOMO_BINARY=$PWD/.build/core/mihomo" >> "$GITHUB_ENV"
      - name: Go tests, race detection and 72 real subscription TCP/UDP links
        run: RUN_UDP_IDLE_TESTS=1 go test -race -timeout=25m -count=1 -v ./...
      - name: Managed runtime account isolation and real TCP/UDP links
        run: |
          go build -tags with_quic,with_utls,with_wireguard -o "$GITHUB_WORKSPACE/.build/managed-core" ./cmd/managed-core
          MANAGED_CORE_BINARY="$GITHUB_WORKSPACE/.build/managed-core" go test -race -count=1 -v -run '^(TestManagedAccountIsolation|TestRealFiveProtocolsTCPUDP)$' ./addons/vpngate/gateway
          MANAGED_CORE_BINARY="$GITHUB_WORKSPACE/.build/managed-core" go test -race -count=1 -v -run '^TestCredentialPublicationRetryDoesNotRepeatRotation$' ./internal/manage
      - name: Formatting, vet and shell checks
        run: |
          test -z "$(gofmt -l manifest.go internal cmd addons/vpngate/gateway)"
          go vet ./...
          for script in sb.sh install.sh lib/*.sh scripts/*.sh; do
            bash -n "$script"
          done
          shellcheck --severity=warning sb.sh install.sh lib/*.sh scripts/*.sh
          bash scripts/test-program-upgrade.sh
          bash scripts/test-install-ownership.sh
          bash scripts/test-installer.sh
      - name: Build Linux management and gateway binary
        run: CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.build/yg-vpngate" ./addons/vpngate/gateway
      - name: Online validator download and current platform CLI
        env:
          SBVPN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .test/core-updater
          cp "$SING_BOX_BINARY" .test/core-updater/sing-box
          sudo --preserve-env=SBVPN_GITHUB_TOKEN .build/yg-vpngate core --root "$PWD/.test/core-updater" prepare --version 1.14.4 --output "$PWD/.test/core-updater/sing-box.candidate"
          printf '%s\n' '{"username":"ci-validator","password":"isolated-validator-test"}' | sudo .build/yg-vpngate panel \
            --root "$PWD/.test/core-updater" --core "$PWD/.test/core-updater/sing-box.candidate" \
            --runtime "$PWD/.build/managed-core" --address 127.0.0.1 --name validator-test --no-system init
          sudo .build/yg-vpngate panel --root "$PWD/.test/core-updater" \
            --core "$PWD/.test/core-updater/sing-box.candidate" --runtime "$PWD/.build/managed-core" --no-system validate
          .build/yg-vpngate core --root "$PWD/.test/core-updater" check
      - name: Real panel API contracts in isolated development mode
        run: GATEWAY_BINARY="$PWD/.build/yg-vpngate" MANAGED_CORE_BINARY="$PWD/.build/managed-core" node scripts/test-panel-local.mjs
      - name: OpenVPN, tunnel DNS and fail-closed namespace acceptance
        run: sudo env GATEWAY_BINARY="$PWD/.build/yg-vpngate" RUN_NETNS_TESTS=1 "$(command -v go)" test -run '^TestLinuxNamespaceIsolation$' -count=1 -v -timeout=6m ./addons/vpngate/gateway
      - name: IPv4 and IPv6 multiport forwarding and owned firewall cleanup
        run: sudo env RUN_FIREWALL_TESTS=1 "$(command -v go)" test -run '^TestLinuxMultiportFirewall$' -count=1 -v -timeout=3m ./internal/manage
      - name: Disk exhaustion and killed accounting process recovery
        run: sudo env RUN_STORAGE_TESTS=1 "$(command -v go)" test -run '^TestLinux(DiskFullRecovery|KilledMeterPreservesReservation)$' -count=1 -v -timeout=2m ./internal/accounting
      - name: systemd startup recovery after firewall loss and unexpected clean exit
        run: sudo env GATEWAY_BINARY="$PWD/.build/yg-vpngate" RUN_SERVICE_TESTS=1 "$(command -v go)" test -run '^TestLinuxServiceStartupRecovery$' -count=1 -v -timeout=2m ./internal/manage
      - name: Build both release architectures
        run: go run ./cmd/release
      - name: Fresh installation and panel deployment rollback
        env:
          SBVPN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::$test_password"
          admin_file="$(mktemp)"
          trap 'rm -f "$admin_file"' EXIT
          printf '{"username":"admin","password":"%s"}' "$test_password" > "$admin_file"
          mkdir -p .test/platform-install
          tar -xzf .build/release/sing-box-vpn-*.tar.gz -C .test/platform-install
          sudo --preserve-env=SBVPN_GITHUB_TOKEN env SB_ADDRESS=127.0.0.1 SB_ADMIN_JSON_FILE="$admin_file" bash .test/platform-install/sing-box-vpn/sb.sh install
          SB_TEST_PASSWORD="$test_password" python3 scripts/test-platform-linux.py
          sudo env RUN_ACCESS_MAINTENANCE_TESTS=1 SB_TEST_ROOT=/etc/s-box SB_TEST_PASSWORD="$test_password" python3 scripts/test-access-maintenance-linux.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-release
          if-no-files-found: error
          path: |
            .build/release/*.tar.gz
            .build/release/SHA256SUMS
  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-release
          path: release
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_DRAFT: ${{ inputs.draft || false }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          archive="release/sing-box-vpn-${RELEASE_VERSION}.tar.gz"
          test -f "$archive"
          (cd release && sha256sum -c SHA256SUMS)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_VERSION" -f "sha=$RELEASE_COMMIT" >/dev/null; then
              echo 'Tag creation failed; checking whether this is a retry.' >&2
            fi
          fi
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_VERSION" --jq '.sha')"
          if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Tag $RELEASE_VERSION does not point to the verified commit" >&2
            exit 1
          fi
          args=("$RELEASE_VERSION" "$archive" release/SHA256SUMS
            --repo "$GITHUB_REPOSITORY" --title "$RELEASE_VERSION" --verify-tag)
          if [[ "$RELEASE_DRAFT" == true ]]; then
            args+=(--draft)
          fi
          if [[ -n "$RELEASE_NOTES" ]]; then
            args+=(--notes "$RELEASE_NOTES")
          else
            args+=(--generate-notes)
          fi
          gh release create "${args[@]}"
